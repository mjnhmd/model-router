[project]
name = "model-router"
version = "0.2.1"
description = "本地 OpenAI 兼容网关：按实时测速 + 能力过滤，把请求路由到最快可用模型"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "pydantic>=2.8",
    "PyYAML>=6.0",
    "tomlkit>=0.13",
    "tomli>=2.0; python_version < '3.11'",
    "typer>=0.12",
    "pywebview>=6.2.1",
]

[project.scripts]
model-router = "model_router.cli:app"

[project.optional-dependencies]
build = [
    "pyinstaller>=6.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/model_router"]

[tool.hatch.build.targets.wheel.force-include]
"web" = "model_router/web"

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
